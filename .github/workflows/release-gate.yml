name: Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Build, Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify production artefact
        run: |
          set -euo pipefail
          test -f dist/server.js
          test ! -e dist/tests

      - name: Run non-database test suite
        run: npm run test:security

  postgres-integration:
    name: PostgreSQL RLS Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nabuuma_rls_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nabuuma_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "55434"
      PGDATABASE: nabuuma_rls_test
      PGUSER: postgres
      PGPASSWORD: postgres
      RUN_RLS_INTEGRATION: "1"
      NABUUMA_TEST_DATABASE_URL: postgresql://nabuuma_runtime:nabuuma_ci_runtime@127.0.0.1:55434/nabuuma_rls_test

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Provision constrained runtime login before migrations
        env:
          RUNTIME_ROLE: nabuuma_runtime
          RUNTIME_PASSWORD: nabuuma_ci_runtime
        run: |
          set -euo pipefail

          psql \
            -X \
            -v ON_ERROR_STOP=1 \
            --set=runtime_role="$RUNTIME_ROLE" \
            --set=runtime_password="$RUNTIME_PASSWORD" <<'SQL'
          SELECT format(
            'CREATE ROLE %I LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L',
            :'runtime_role',
            :'runtime_password'
          )
          WHERE NOT EXISTS (
            SELECT 1
            FROM pg_roles
            WHERE rolname = :'runtime_role'
          )
          \gexec
          SQL

      - name: Apply canonical migrations
        run: |
          set -euo pipefail

          migration_count="$(find db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d '[:space:]')"
          expected=1

          for migration in db/migrations/*.sql; do
            test -f "$migration"

            filename="$(basename "$migration")"
            prefix="$(printf '%05d' "$expected")"

            case "$filename" in
              "${prefix}"_*.sql) ;;
              *)
                printf '[ERROR] expected migration %s, found %s\n' \
                  "$prefix" "$filename" >&2
                exit 1
                ;;
            esac

            printf '==> %s\n' "$migration"

            psql \
              -X \
              -v ON_ERROR_STOP=1 \
              -f "$migration"

            expected=$((expected + 1))
          done

          test "$expected" -eq "$((migration_count + 1))" || {
            printf '[ERROR] expected %s sequential migrations (00001..%05d)\n' "$migration_count" "$migration_count" >&2
            exit 1
          }

      - name: Grant constrained runtime application role
        env:
          RUNTIME_ROLE: nabuuma_runtime
        run: |
          set -euo pipefail

          psql \
            -X \
            -v ON_ERROR_STOP=1 \
            --set=runtime_role="$RUNTIME_ROLE" <<'SQL'
          SELECT format(
            'GRANT %I TO %I',
            'nabuuma_app',
            :'runtime_role'
          )
          \gexec
          SQL

      - name: Execute approved database postconditions
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f deployment/sql/approved-db-postconditions.sql

      - name: Build release test runtime
        run: npm run build

      - name: Verify PostgreSQL external identity authority
        run: node scripts/test-external-identity-postgres.mjs

      - name: Verify Auth0 HTTP PostgreSQL composition
        env:
          NABUUMA_TEST_ADMIN_USER: postgres
          NABUUMA_DISPOSABLE_TEST_DATABASE: "1"
          NABUUMA_AUTH0_DISPOSABLE_DATABASE_URL: postgresql://nabuuma_runtime:nabuuma_ci_runtime@127.0.0.1:55434/nabuuma_rls_test
        run: node scripts/test-auth0-http-postgres.mjs

      - name: Verify Academy learner lifecycle PostgreSQL E2E
        run: node scripts/test-academy-learner-e2e-postgres.mjs

      - name: Verify audit ledger PostgreSQL security and continuity
        run: node scripts/test-audit-ledger-postgres.mjs

      - name: Verify security roles
        run: |
          set -euo pipefail

          result="$(
            psql -X -v ON_ERROR_STOP=1 -Atc "
              SELECT concat_ws(
                '|',
                CASE
                  WHEN EXISTS (
                    SELECT 1
                    FROM pg_roles
                    WHERE rolname = 'nabuuma_app'
                      AND NOT rolsuper
                      AND NOT rolbypassrls
                  )
                  THEN 'APP_SAFE'
                  ELSE 'APP_UNSAFE'
                END,
                CASE
                  WHEN EXISTS (
                    SELECT 1
                    FROM pg_roles
                    WHERE rolname = 'nabuuma_certificate_verifier'
                      AND NOT rolcanlogin
                      AND NOT rolsuper
                      AND NOT rolbypassrls
                  )
                  THEN 'VERIFIER_SAFE'
                  ELSE 'VERIFIER_UNSAFE'
                END,
                CASE
                  WHEN EXISTS (
                    SELECT 1
                    FROM pg_roles
                    WHERE rolname = 'nabuuma_runtime'
                      AND rolcanlogin
                      AND NOT rolinherit
                      AND NOT rolsuper
                      AND NOT rolbypassrls
                      AND NOT rolcreatedb
                      AND NOT rolcreaterole
                      AND NOT rolreplication
                  )
                  THEN 'RUNTIME_SAFE'
                  ELSE 'RUNTIME_UNSAFE'
                END
              );
            "
          )"

          test "$result" = "APP_SAFE|VERIFIER_SAFE|RUNTIME_SAFE"

      - name: Verify runtime database identity
        env:
          PGPASSWORD: nabuuma_ci_runtime
          PGUSER: nabuuma_runtime
        run: |
          set -euo pipefail

          identity="$(
            psql \
              -X \
              -w \
              -v ON_ERROR_STOP=1 \
              -Atc "
                SELECT concat_ws(
                  '|',
                  session_user,
                  current_user,
                  current_database(),
                  (
                    SELECT rolsuper
                    FROM pg_roles
                    WHERE rolname = current_user
                  ),
                  (
                    SELECT rolbypassrls
                    FROM pg_roles
                    WHERE rolname = current_user
                  )
                );
              "
          )"

          test "$identity" = \
            "nabuuma_runtime|nabuuma_runtime|nabuuma_rls_test|f|f"

      - name: Typecheck
        run: npm run typecheck

      - name: Verify native ESM imports
        run: npm run verify:esm-imports

      - name: Run release suite and enforce zero skips
        run: npm run test:release:zero-skip

  container:
    name: Production Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
      - postgres-integration

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nabuuma-hospitality:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
