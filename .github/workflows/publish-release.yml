name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mavadojunior/nabuuma-hospitality-platform

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          readonly tag="${GITHUB_REF_NAME}"

          if ! printf '%s\n' "$tag" |
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            printf '[ERROR] release tag must be vMAJOR.MINOR.PATCH: %s\n' \
              "$tag" >&2
            exit 1
          fi

          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release commit belongs to protected main
        shell: bash
        run: |
          set -euo pipefail

          git fetch \
            --no-tags \
            origin \
            "+refs/heads/main:refs/remotes/origin/main"

          if ! git merge-base \
            --is-ancestor \
            "$GITHUB_SHA" \
            "origin/main"; then
            printf '%s\n' \
              '[ERROR] release commit is not part of protected main' >&2
            exit 1
          fi

  publish-image:
    name: Publish Production Image
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=sha,prefix=sha-,format=long

      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-release:
    name: Publish GitHub Release
    needs:
      - validate
      - publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Nabuuma Hospitality Platform ${RELEASE_VERSION}"
