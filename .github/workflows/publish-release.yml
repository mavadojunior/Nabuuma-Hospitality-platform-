name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mavadojunior/nabuuma-hospitality-platform

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      actions: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          readonly tag="${GITHUB_REF_NAME}"

          if ! printf '%s\n' "$tag" |
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            printf '[ERROR] release tag must be vMAJOR.MINOR.PATCH: %s\n' \
              "$tag" >&2
            exit 1
          fi

          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release commit belongs to protected main
        shell: bash
        run: |
          set -euo pipefail

          git fetch \
            --no-tags \
            origin \
            "+refs/heads/main:refs/remotes/origin/main"

          if ! git merge-base \
            --is-ancestor \
            "$GITHUB_SHA" \
            "origin/main"; then
            printf '%s\n' \
              '[ERROR] release commit is not part of protected main' >&2
            exit 1
          fi

      - name: Require successful main release gate for exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gate_runs="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release-gate.yml \
              --commit "$GITHUB_SHA" \
              --branch main \
              --event push \
              --status success \
              --json headSha,headBranch,event,status,conclusion
          )"

          if ! printf '%s' "$gate_runs" |
            jq --exit-status --arg sha "$GITHUB_SHA" \
              'any(.[]; .headSha == $sha and .headBranch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")' \
              >/dev/null; then
            printf '%s\n' \
              '[ERROR] no successful main release-gate run exists for this exact commit' >&2
            exit 1
          fi

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout complete release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go for pinned Gitleaks CLI
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan release source and Git history
        shell: bash
        run: |
          set -euo pipefail
          command -v gitleaks >/dev/null 2>&1 || {
            printf '%s\n' '[ERROR] Gitleaks executable is unavailable' >&2
            exit 1
          }
          gitleaks git --redact --exit-code 1 .

  publish-image:
    name: Publish Production Image
    needs:
      - validate
      - secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=sha,prefix=sha-,format=long

      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-release:
    name: Publish GitHub Release
    needs:
      - validate
      - secret-scan
      - publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Nabuuma Hospitality Platform ${RELEASE_VERSION}"
