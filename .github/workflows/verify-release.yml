name: Verify Release

on:
  workflow_run:
    workflows:
      - Publish Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing SemVer release tag to verify
        required: true
        type: string
      release_sha:
        description: Expected release commit SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: verify-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mavadojunior/nabuuma-hospitality-platform

jobs:
  verify:
    name: Verify Published Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
      - name: Resolve automatic release identity
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
          printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Resolve manual release identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_TAG"
          test -n "$RELEASE_SHA"

          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
          printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail

          test -n "${RELEASE_TAG:-}"
          test -n "${RELEASE_SHA:-}"

          if ! printf '%s\n' "$RELEASE_TAG" |
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          then
            printf '[ERROR] unexpected release tag: %s\n' \
              "$RELEASE_TAG" >&2
            exit 1
          fi

          if ! printf '%s\n' "$RELEASE_SHA" |
            grep -Eq '^[0-9a-f]{40}$'
          then
            printf '[ERROR] invalid release SHA: %s\n' \
              "$RELEASE_SHA" >&2
            exit 1
          fi

          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify GitHub Release target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          ref_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          )"

          target_type="$(
            printf '%s' "$ref_json" |
              jq -r '.object.type'
          )"

          target_sha="$(
            printf '%s' "$ref_json" |
              jq -r '.object.sha'
          )"

          if [ "$target_type" = "tag" ]; then
            target_sha="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/git/tags/${target_sha}" \
                --jq '.object.sha'
            )"
          fi

          test "$target_sha" = "$RELEASE_SHA" || {
            printf '[ERROR] tag resolves to %s, expected %s\n' \
              "$target_sha" "$RELEASE_SHA" >&2
            exit 1
          }

          release_json="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease
          )"

          test "$(
            printf '%s' "$release_json" |
              jq -r '.tagName'
          )" = "$RELEASE_TAG"

          test "$(
            printf '%s' "$release_json" |
              jq -r '.isDraft'
          )" = "false"

          test "$(
            printf '%s' "$release_json" |
              jq -r '.isPrerelease'
          )" = "false"

      - name: Verify multi-platform image manifest
        shell: bash
        env:
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          manifest="$(
            docker buildx imagetools inspect \
              "${IMAGE}:${IMAGE_VERSION}"
          )"

          printf '%s\n' "$manifest"

          printf '%s\n' "$manifest" |
            grep -F 'linux/amd64'

          printf '%s\n' "$manifest" |
            grep -F 'linux/arm64'

      - name: Install pinned GitHub CLI
        shell: bash
        env:
          GH_CLI_VERSION: "2.103.2"
        run: |
          set -euo pipefail

          case "$RUNNER_ARCH" in
            X64)
              archive_arch="amd64"
              ;;
            ARM64)
              archive_arch="arm64"
              ;;
            *)
              printf '[ERROR] unsupported runner architecture: %s\n' \
                "$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac

          archive="gh_${GH_CLI_VERSION}_linux_${archive_arch}.tar.gz"
          base_url="https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}"
          workdir="$RUNNER_TEMP/gh-${GH_CLI_VERSION}"

          mkdir -p "$workdir"

          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --output "$workdir/$archive" \
            "$base_url/$archive"

          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --output "$workdir/checksums.txt" \
            "$base_url/gh_${GH_CLI_VERSION}_checksums.txt"

          expected="$(
            awk -v file="$archive" \
              '$2 == file { print $1 }' \
              "$workdir/checksums.txt"
          )"

          test -n "$expected" || {
            printf '[ERROR] checksum missing for %s\n' \
              "$archive" >&2
            exit 1
          }

          actual="$(
            sha256sum "$workdir/$archive" |
              awk '{ print $1 }'
          )"

          test "$actual" = "$expected" || {
            printf '[ERROR] checksum mismatch for %s\n' \
              "$archive" >&2
            exit 1
          }

          tar \
            -xzf "$workdir/$archive" \
            -C "$workdir"

          install \
            -m 0755 \
            "$workdir/gh_${GH_CLI_VERSION}_linux_${archive_arch}/bin/gh" \
            "$RUNNER_TEMP/gh"

          test "$("$RUNNER_TEMP/gh" --version |
            awk 'NR == 1 { print $3 }'
          )" = "$GH_CLI_VERSION"

          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify GitHub provenance attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          gh attestation verify \
            "oci://${IMAGE}:${IMAGE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
              "${GITHUB_REPOSITORY}/.github/workflows/publish-release.yml"
