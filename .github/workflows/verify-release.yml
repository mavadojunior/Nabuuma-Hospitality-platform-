name: Verify Release

on:
  workflow_run:
    workflows:
      - Publish Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing SemVer release tag to verify
        required: true
        type: string
      release_sha:
        description: Expected release commit SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: verify-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mavadojunior/nabuuma-hospitality-platform

jobs:
  verify:
    name: Verify Published Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
      - name: Resolve release identity
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if ! printf '%s\n' "$RELEASE_TAG" |
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          then
            printf '[ERROR] unexpected release tag: %s\n' \
              "$RELEASE_TAG" >&2
            exit 1
          fi

          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify GitHub Release target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          ref_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          )"

          target_type="$(
            printf '%s' "$ref_json" |
              jq -r '.object.type'
          )"

          target_sha="$(
            printf '%s' "$ref_json" |
              jq -r '.object.sha'
          )"

          if [ "$target_type" = "tag" ]; then
            target_sha="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/git/tags/${target_sha}" \
                --jq '.object.sha'
            )"
          fi

          test "$target_sha" = "$RELEASE_SHA" || {
            printf '[ERROR] tag resolves to %s, expected %s\n' \
              "$target_sha" "$RELEASE_SHA" >&2
            exit 1
          }

          release_json="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease
          )"

          test "$(
            printf '%s' "$release_json" |
              jq -r '.tagName'
          )" = "$RELEASE_TAG"

          test "$(
            printf '%s' "$release_json" |
              jq -r '.isDraft'
          )" = "false"

          test "$(
            printf '%s' "$release_json" |
              jq -r '.isPrerelease'
          )" = "false"

      - name: Verify multi-platform image manifest
        shell: bash
        env:
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          manifest="$(
            docker buildx imagetools inspect \
              "${IMAGE}:${IMAGE_VERSION}"
          )"

          printf '%s\n' "$manifest"

          printf '%s\n' "$manifest" |
            grep -F 'linux/amd64'

          printf '%s\n' "$manifest" |
            grep -F 'linux/arm64'

      - name: Require patched GitHub CLI
        shell: bash
        run: |
          set -euo pipefail

          minimum="2.102.0"
          current="$(
            gh version --json version --jq '.version'
          )"

          first="$(
            printf '%s\n%s\n' "$minimum" "$current" |
              sort -V |
              head -n 1
          )"

          test "$first" = "$minimum" || {
            printf '[ERROR] gh >= %s required, found %s\n' \
              "$minimum" "$current" >&2
            exit 1
          }

      - name: Verify GitHub provenance attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          gh attestation verify \
            "oci://${IMAGE}:${IMAGE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
              "${GITHUB_REPOSITORY}/.github/workflows/publish-release.yml"
